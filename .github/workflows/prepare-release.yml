name: Prepare Release

on:
  push:
    branches: [main]

jobs:
  release-plz-release:
    name: Publish release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT/App token so the tag push triggers the cargo-dist release workflow.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Create and push release tag
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Prepare release pull request and previews
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Open or update release pull request
        uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Set up sccache
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        if: steps.release-plz.outputs.prs_created == 'true'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install VHS and recording fonts
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: 'true'

      - name: Record previews and update release pull request
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          PR_DATA: ${{ steps.release-plz.outputs.pr }}
        run: |
          PR_BRANCH=$(echo "$PR_DATA" | jq -r '(.head_branch // .prs[0].head_branch // empty)')
          if [ -z "$PR_BRANCH" ]; then
            git fetch origin
            PR_BRANCH=$(git branch -r --list 'origin/release-*' --sort=-committerdate | head -n1 | sed 's| *origin/||')
          fi

          if [ -z "$PR_BRANCH" ]; then
            echo "No release branch found. Skipping VHS demo recording."
            exit 0
          fi

          echo "Switching to release branch: $PR_BRANCH"
          git fetch origin "$PR_BRANCH":"$PR_BRANCH"
          git checkout "$PR_BRANCH"

          echo "Building binaries and recording VHS tapes..."
          ./scripts/record-demos.sh

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/demos/*.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs(demo): refresh automated terminal previews for release"
            git push origin "$PR_BRANCH"
          else
            echo "No visual demo diff detected."
          fi
