name: Record Terminal Previews

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit newly generated GIFs back to current branch"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'assets/vhs/**'
      - 'docs/vhs/**'
      - 'scripts/record-demos.sh'
      - '.github/workflows/record-previews.yml'

jobs:
  record-demos:
    name: Render terminal previews
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install VHS and recording fonts
        uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: 'true'

      - name: Build binaries and record previews
        run: |
          ./scripts/record-demos.sh

      - name: Upload preview GIFs
        uses: actions/upload-artifact@v4
        with:
          name: vhs-terminal-previews
          path: assets/demos/*.gif

      - name: Commit preview GIFs to branch
        if: github.event_name == 'workflow_dispatch' && inputs.commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/demos/*.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs(demo): refresh automated VHS recordings [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No visual demo changes detected."
          fi
