[workspace]
resolver = "2"
members = [
    "apps/perihelion",
    "apps/helion",
    "crates/peri-vfs",
    "crates/peri-net",
    "crates/peri-archive",
    "common/peri-core",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
authors = ["Eduardo Marques Santos", "Perihelion Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dukasn/perihelion"
homepage = "https://github.com/dukasn/perihelion"
publish = true

[workspace.dependencies]
# Internal domain and crates
peri-core = { path = "common/peri-core", version = "0.1.2" }
peri-vfs = { path = "crates/peri-vfs", version = "0.1.2" }
peri-net = { path = "crates/peri-net", version = "0.1.2" }
peri-archive = { path = "crates/peri-archive", version = "0.1.2" }
helion = { path = "apps/helion", version = "0.1.2" }

# Serialization & Manifest parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_spanned = "1.1"
toml = { version = "1.1", features = ["preserve_order"] }
semver = { version = "1.0", features = ["serde"] }

# Graph & Constraint Solving
petgraph = "0.8"
pubgrub = "0.4"

# Diagnostics & Error handling
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

# TUI Primitives
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"

# CLI & Telemetry
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.54", features = ["full"] }

# System, Archive & Network adapters
nix = { version = "0.31", features = ["mount", "sched", "user", "fs", "signal", "process"] }
tar = "0.4"
zstd = { version = "0.14", features = ["zstdmt"] }
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tempfile = "3.27"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
shellexpand = "3.1"
directories = "6.0"

# Production release profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Speed up external dependencies during debug builds
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp" }

