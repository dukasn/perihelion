[package]
name = "peri-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
description = "P2P BitTorrent swarm and HTTP streaming network transport adapter for Perihelion"
keywords = ["bittorrent", "torrent", "p2p", "streaming", "reqwest"]
categories = ["network-programming", "asynchronous"]

[dependencies]
peri-core.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io", "io-util"] }
bytes = "1.0"
futures-util = "0.3"
reqwest.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
librqbit = { workspace = true, optional = true }

[features]
default = []
bittorrent = ["dep:librqbit"]

[dev-dependencies]
tempfile.workspace = true
peri-archive.workspace = true

