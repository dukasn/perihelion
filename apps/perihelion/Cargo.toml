[package]
name = "perihelion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Perihelion: peri CLI, perid seeding daemon and helion TUI"

[package.metadata.dist]
dist = true

[[bin]]
name = "peri"
path = "src/bin/peri/main.rs"

[[bin]]
name = "perid"
path = "src/bin/perid/main.rs"

[[bin]]
name = "helion"
path = "src/bin/helion/main.rs"

[dependencies]
helion = { path = "../helion" }
peri-core.workspace = true
peri-vfs.workspace = true
peri-net = { workspace = true, features = ["bittorrent"] }
peri-archive.workspace = true

clap.workspace = true
miette.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
semver.workspace = true
shellexpand.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
