[package]
name = "perihelion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
description = "Next-generation game-agnostic native Linux mod manager and VFS orchestrator"
keywords = ["mod-manager", "overlayfs", "gaming", "linux", "cli"]
categories = ["command-line-utilities", "filesystem", "virtualization"]

[package.metadata.dist]
dist = true

[[bin]]
name = "peri"
path = "src/bin/peri/main.rs"

[[bin]]
name = "perid"
path = "src/bin/perid/main.rs"

[[bin]]
name = "helion"
path = "src/bin/helion/main.rs"

[dependencies]
helion.workspace = true
peri-core.workspace = true
peri-vfs.workspace = true
peri-net = { workspace = true, features = ["bittorrent"] }
peri-archive.workspace = true

clap.workspace = true
miette.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
semver.workspace = true
shellexpand.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
